  <text x="82" y="132" fill="#8d9098" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14">Preview only · 先选角色方向，再制作完整 8×11 动画图集</text>
