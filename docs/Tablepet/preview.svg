    </filter>
    <filter id="softGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#25272b" stroke-width="1" opacity=".55"/>
    </pattern>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
